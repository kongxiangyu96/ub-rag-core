services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ub-rag-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ub-rag-core-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_DIM: 1024
      RERANKER_MODEL_NAME: BAAI/bge-reranker-v2-m3
      MODEL_CACHE_DIR: /app/.model_cache
      HF_ENDPOINT: https://hf-mirror.com
      DEVICE: cpu
      USE_FP16: "false"
      LOG_LEVEL: INFO
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/app/.model_cache

volumes:
  pgdata:
  model-cache:
